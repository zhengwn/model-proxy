[workspace]
members = ["crates/proxy-core", "src-tauri"]
resolver = "2"

[package]
name = "model-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
proxy-core = { path = "crates/proxy-core" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
